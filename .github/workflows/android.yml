name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx cap sync android

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64 (ver README, sección Firma)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kcal-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kcal-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk kcal-count.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kcal-count-apk
          path: kcal-count.apk

      # Publica el APK en Releases para descargarlo desde el móvil:
      # https://github.com/<owner>/<repo>/releases/latest/download/kcal-count.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: kcal 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: kcal-count.apk
          body: |
            Descarga `kcal-count.apk` desde el móvil e instálalo.
            Si ya tienes la app, se actualiza sin perder tus datos.
